---
- name: Download Helm installer script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/release-4.2/scripts/get-helm-4
    dest: /tmp/get_helm.sh
    mode: '0700'

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get_helm.sh
  environment:
    DESIRED_VERSION: "{{ cilium_helm_version }}"
  # No need for `args.creates` as the script keeps idempotency itself
  changed_when: false

- name: Deploy Cilium chart
  kubernetes.core.helm:
    name: cilium
    chart_ref: oci://quay.io/cilium/charts/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ cilium_kubeconfig }}"
    atomic: true
    wait: true
    timeout: 10m
    values: "{{ lookup('template', 'cilium-values.yaml.j2') | from_yaml }}"
  notify:
    - Wait for Cilium to finish deployment
    - Test Cilium's connectivity
  ignore_errors: "{{ ansible_check_mode }}"

# TODO: replace `keep_newer` with an actual version gate
- name: Install Cilium CLI
  ansible.builtin.unarchive:
    src: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    keep_newer: true
