---
- name: Ensure K3s configuration directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Deploy K3s configuration file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart K3s service

- name: Ensure K3s is stopped
  ansible.builtin.systemd_service:
    name: k3s
    state: stopped
  when:
    - k3s_etcd_db_path not in (ansible_mounts | map(attribute='mount') | list)
    - ansible_facts.services['k3s.service'] is defined

- name: Ensure K3s etcd snapshot directory exists
  ansible.builtin.file:
    path: "{{ k3s_etcd_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

# The datastore is intentionally ephemeral: mounting a fresh tmpfs here discards
# (shadows) any etcd data that lived on disk. The cluster re-bootstraps and Flux
# reconciles it back from Git.
- name: Mount tmpfs on etcd database directory
  ansible.posix.mount:
    path: "{{ k3s_etcd_db_path }}"
    src: tmpfs
    fstype: tmpfs
    opts: "rw,nodev,nosuid,uid=root,gid=root,mode=1700,size=1G"
    state: mounted

- name: Create k3s tmpfs etcd recovery script
  ansible.builtin.copy:
    src: k3s-tmpfs-snapshot-recover.sh
    dest: /usr/local/bin/k3s-tmpfs-snapshot-recover.sh
    mode: '0755'

- name: Create etcd restore systemd unit
  ansible.builtin.template:
    src: k3s-tmpfs-snapshot-recover.service.j2
    dest: /etc/systemd/system/k3s-tmpfs-snapshot-recover.service
    owner: root
    group: root
    mode: '0644'

- name: Enable etcd restore systemd unit
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: k3s-tmpfs-snapshot-recover
    enabled: true

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0700'

- name: Install K3s
  ansible.builtin.command:
    cmd: /tmp/k3s_install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

- name: Ensure K3s service is started and enabled
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create .kube directory for user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Copy K3s config to user's .kube/config
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
