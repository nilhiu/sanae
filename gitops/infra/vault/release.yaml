apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m
  timeout: 5m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  maxHistory: 3
  chart:
    spec:
      chart: vault
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: vault
      version: 0.34.1
  values:
    global:
      # TODO: wire up cert-manager and enable TLS
      tlsDisable: true
    injector:
      enabled: false
    server:
      affinity: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 512Mi
      ha:
        enabled: true
        replicas: 1
        disruptionBudget:
          # disable disruption budget on one replica setups to avoid hangs during drain
          enabled: false
        raft:
          enabled: true
      dataStorage:
        size: 2Gi
        storageClass: local-path
